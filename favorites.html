<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Your saved recipes in Recipe Explorer." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Favorites | Recipe Explorer</title>
  </head>

  <body>
    <header class="header">
      <div class="container header__inner">
        <a
          class="header__logo"
          href="./index.html"
          aria-label="Recipe Explorer home"
        >
          <img
            class="header__logo-icon"
            src="/src/assets/icons/astroid.svg"
            alt=""
            aria-hidden="true"
          />

          <span class="header__logo-text"> Recipe Explorer </span>
        </a>

        <nav class="header__nav" aria-label="Primary navigation">
          <a class="header__link" href="./index.html"> Explore </a>

          <a
            class="header__link header__link--active"
            href="./favorites.html"
            aria-current="page"
          >
            Favorites
          </a>
        </nav>
      </div>
    </header>

    <main>
      <section class="favorites">
        <div class="container">
          <div class="favorites__header">
            <h1 class="favorites__title">Your favorites</h1>

            <p class="favorites__description">
              Recipes you've saved for later.
            </p>
          </div>

          <div
            class="favorites__grid recipes__grid"
            id="favorites-grid"
            aria-live="polite"
          ></div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/favorites.js"></script>
  </body>
</html>
